
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devops Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background-color: white;
            padding: 50px;
            width: 90%;
            max-width: 600px;
            text-align: center;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #333;
            font-size: 36px;
            margin-bottom: 20px;
        }

        p {
            color: #666;
            font-size: 17px;
            margin-bottom: 15px;
            line-height: 1.6;
        }

        button {
            background-color: #667eea;
            color: white;
            border: none;
            padding: 14px 30px;
            margin-top: 15px;
            font-size: 16px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #764ba2;
            transform: scale(1.05);
        }

        .footer {
            margin-top: 30px;
            font-size: 13px;
            color: #999;
        }

    </style>
</head>

<body>

    <div class="container">
        <h1>Welcome to DevOps Lab!</h1>
        <p>This is my first web application.</p>
        <p>Developed and managed using HTML, CSS, JavaScript, Git and GitHub.</p>
        <button onclick="showMessage()">Click Here</button>
        <div class="footer">
            © 2026 My Website | DevOps Lab Experiment
        </div>

    </div>

    <script>
        function showMessage() {
            alert("Application is running successfully!");
        }
    </script>

</body>
</html>
